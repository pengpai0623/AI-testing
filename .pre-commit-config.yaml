#       additional_dependencies:
#         - flake8-bugbear==24.2.6
#         - flake8-comprehensions
#         - flake8-simplify
#       exclude: ^src/blib2to3/

- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
    - id: black
      language_version: python3.10
      args: [--line-length=120]
